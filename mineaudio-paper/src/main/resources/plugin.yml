name: MineAudio
version: '${version}'
main: com.mineaudio.MineAudioPlugin
api-version: '26.2'
description: 统一音乐 / 环境音 / 游戏音效基础设施
author: ubuntu
softdepend:
  - PackHost
  - NoteBlockAPI
  - MoeMusic
  - MineUI
  - PlaceholderAPI
commands:
  mineaudio:
    description: MineAudio 主命令
    usage: /mineaudio
permissions:
  mineaudio.admin:
    description: 允许 /mineaudio 管理命令
    default: op
