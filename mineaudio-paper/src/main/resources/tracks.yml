# MineAudio 曲目（MUSIC / AMBIENT / NBS 等完整音频）
#
# 字段说明：
#   type: PACK | VANILLA | NBS
#   bus:  MUSIC | AMBIENT | SFX | UI（默认 MUSIC）
#   duration: 毫秒，PACK / VANILLA 循环必须提供
#   loop / volume / pitch / title / author
#   fallback: 资源包未加载或 Backend 不可用时降级
#     type: VANILLA | PACK
#     sound: minecraft:xxx 或 mineaudio:xxx
#   NBS 曲目用 file: xxx.nbs（文件放 plugins/MineAudio/nbs/）
tracks:
  # 示例曲目：资源包里的 12 秒占位音乐，可直接改成正式素材
  demo:
    type: PACK
    bus: MUSIC
    sound: mineaudio:music.demo
    duration: 12000
    loop: true
    volume: 0.7
    fallback:
      type: VANILLA
      sound: minecraft:music.overworld.forest
#
# 其他示例：
#   spawn:
#     type: PACK
#     bus: MUSIC
#     sound: mineaudio:music.spawn
#     duration: 180000
#     loop: true
#
#   tavern:
#     type: NBS
#     bus: MUSIC
#     file: tavern.nbs
#     loop: true
#
#   radio:
#     type: STREAM               # 需要服务器安装 MoeMusic 且玩家装 MoeMusic 客户端
#     bus: MUSIC
#     provider: moemusic
#     source: netease            # 音源插件 ID（netease / qqmusic / kugou ...）
#     id: "1234567890"           # 曲目 ID；也可改用 uri: "https://..."（默认禁用）
#     fallback:                  # 无 MoeMusic 客户端/服务端时的降级
#       type: PACK
#       sound: mineaudio:music.demo
