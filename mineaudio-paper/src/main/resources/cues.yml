#       sound: minecraft:item.book.page_turn
#
#   minechess:piece.move:
#     primary:
#       type: PACK
#       sound: minechess:piece.move
#     fallback:
#       type: VANILLA
#       sound: minecraft:block.wood.place
cues: {}
