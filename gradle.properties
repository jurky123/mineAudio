# Gradle 运行参数（本机 2 vCPU / 7.5G，构建时与 Paper 共存）
org.gradle.jvmargs=-Xmx1536M
org.gradle.parallel=true
org.gradle.configuration-cache=false

# MineAudio
mineaudio_version=0.2.1

# Paper（与线上 paper-26.2-124.jar 一致）
paper_version=26.2.build.124-stable

# NBS（JitPack；与服务器安装的 NoteBlockAPI 插件版本对应）
noteblockapi_version=1.7.0

# MineUI 业务 API（可选集成，需先 cd ../mineUI && ./gradlew :mineui-paper:publishToMavenLocal）
mineui_version=0.11.0

# PlaceholderAPI（可选集成，计分板显示正在播放）
placeholderapi_version=2.12.3

# Minecraft / Fabric（仅支持 26.2）
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.160.0+26.2
