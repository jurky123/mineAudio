# MineAudio 主配置
#
# 详解见 docs/PLAN.md；
# tracks.yml / cues.yml / regions.yml / emitters.yml 分别管理曲目、音效事件、区域与发声点。

# 区域检测间隔（tick）：每多少 tick 检查一次玩家所在区域
region-check-interval-ticks: 10

# 区域边界迟滞，避免站在边缘反复切歌
region-enter-delay-ms: 300
region-exit-delay-ms: 500

# AMBIENT 最大同时层数，避免噪音叠加
max-ambient-layers: 3

# 红石 Emitter 轮询间隔（tick）
emitter-poll-interval-ticks: 5

nbs:
  # PositionSongPlayer 的可听距离（方块）；V1 的 Emitter radius 暂用该默认值
  position-distance: 32

pack:
  # 无 PackHost / 未跟踪到资源包状态时，默认视为已加载；
  # 收到玩家资源包加载失败事件后自动按未加载处理（走 fallback）
  assume-loaded: true

stream:
  # 未检测到流媒体客户端时是否仍尝试流播放（默认关闭，按 fallback 降级）
  assume-available: false
  # 是否允许 uri 直链（仍交由 MoeMusic 的权限与媒体防火墙校验）
  http-enabled: false
  # http-enabled 时的主机白名单；留空表示不限制主机
  allowed-hosts: []
  # StreamProvider 选择顺序（前面的优先）
  provider-priority:
    - mineaudio-client
    - moemusic

# MineAudio Client（配套 mod）协议
stream-client:
  enabled: true
  # 握手等待时间；超时按未安装处理
  handshake-timeout-ms: 3000
  # 客户端状态上报间隔（客户端也会按此配置发送）
  state-report-ms: 1000
  sync:
    enabled: true
    # 全服同步的起播提前量
    initial-lead-ms: 1200
    ping-interval-ms: 10000
    drift-threshold-ms: 150
  firewall:
    https-only: true
    deny-private-network: true
    max-redirects: 5
  legacy-moemusic:
    enabled: true

# 输出更多日志，便于排查
debug: false
