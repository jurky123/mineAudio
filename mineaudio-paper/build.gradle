plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    // NoteBlockAPI 只发布在 JitPack（运行时由服务器上的 NoteBlockAPI 插件提供）
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    // PlaceholderAPI（可选集成）
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_version}"
    compileOnly project(':mineaudio-api')
    compileOnly project(':mineaudio-protocol')
    compileOnly "com.github.koca2000:NoteBlockAPI:${noteblockapi_version}"
    // MineUI 业务 API（可选集成：未安装时退化为聊天状态）
    compileOnly "com.mineui:mineui-paper:${mineui_version}"
    // PlaceholderAPI（可选集成：计分板显示正在播放）
    compileOnly "me.clip:placeholderapi:${placeholderapi_version}"

    // 单测需要 YamlConfiguration 等 Bukkit 配置类，以及 api 模块的模型
    testImplementation "io.papermc.paper:paper-api:${paper_version}"
    testImplementation project(':mineaudio-api')
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
    // 本地绑定页面由服务端推送页面自动生成，避免两份大 JSON 长期分叉
    doLast {
        def uiDir = destinationDir.toPath().resolve('assets/mineaudio/ui/mineaudio')
        def variants = [
                'player.json': ['player-local.json', [
                        ('"value": "{state.percent}"')  : '"value": "{local.mineaudio.percent}"',
                        ('"playing": "{state.playing}"'): '"playing": "{local.mineaudio.playing}"',
                        ('"interpolate": true')         : '"interpolate": false',
                        ('"text": "{state.time}"')      : '"text": "{local.mineaudio.time}"',
                        ('"action": "seek_to"')         : '"action": "local:mineaudio.seek"',
                        ('"action": "pause"')           : '"action": "local:mineaudio.pause"',
                        ('"action": "resume"')          : '"action": "local:mineaudio.resume"',
                        ('"action": "seek_back"')       : '"action": "local:mineaudio.seek_back"',
                        ('"action": "seek_fwd"')        : '"action": "local:mineaudio.seek_fwd"',
                        ('"value": "{state.volume_num}"') : '"value": "{local.mineaudio.volume}"',
                        ('"action": "vol_set"')         : '"action": "local:mineaudio.volume"',
                        ('"spinPlaying": "{state.playing}"'): '"spinPlaying": "{local.mineaudio.playing}"',
                ]],
                'hud.json'   : ['hud-local.json', [
                        ('"value": "{state.percent}"')  : '"value": "{local.mineaudio.percent}"',
                        ('"playing": "{state.playing}"'): '"playing": "{local.mineaudio.playing}"',
                        ('"interpolate": true')         : '"interpolate": false',
                        ('"text": "{state.time}"')      : '"text": "{local.mineaudio.time}"',
                        ('"spinPlaying": "{state.playing}"'): '"spinPlaying": "{local.mineaudio.playing}"',
                ]],
        ]
        variants.each { source, spec ->
            def text = new File(uiDir.toFile(), source).getText('UTF-8')
            spec[1].each { from, to -> text = text.replace(from, to) }
            new File(uiDir.toFile(), spec[0]).setText(text, 'UTF-8')
        }
    }
}

jar {
    archiveBaseName = 'MineAudio'
    // 把纯 Java API / 协议模块内嵌进插件 jar，业务插件编译期引用、运行期不额外带依赖
    from { project(':mineaudio-api').sourceSets.main.output }
    from { project(':mineaudio-protocol').sourceSets.main.output }
    dependsOn ':mineaudio-api:classes', ':mineaudio-protocol:classes'
}
