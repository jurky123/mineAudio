# MineAudio 主配置
#
# 详解见 docs/PLAN.md；
# tracks.yml / cues.yml / regions.yml / emitters.yml 分别管理曲目、音效事件、区域与发声点。

# 区域检测间隔（tick）：每多少 tick 检查一次玩家所在区域
region-check-interval-ticks: 10

# 区域边界迟滞，避免站在边缘反复切歌
region-enter-delay-ms: 300
region-exit-delay-ms: 500

# AMBIENT 最大同时层数，避免噪音叠加
max-ambient-layers: 3

# 红石 Emitter 轮询间隔（tick）
emitter-poll-interval-ticks: 5

nbs:
  # PositionSongPlayer 的可听距离（方块）；V1 的 Emitter radius 暂用该默认值
  position-distance: 32

pack:
  # 无 PackHost / 未跟踪到资源包状态时，默认视为已加载；
  # 收到玩家资源包加载失败事件后自动按未加载处理（走 fallback）
  assume-loaded: true

stream:
  # 未检测到 MineAudio Client 时是否仍尝试流播放（默认关闭，按 fallback 降级）
  assume-available: false
  # 是否允许 uri 直链（客户端 MediaFirewall 仍会校验 https/主机白名单）
  http-enabled: false
  # http-enabled 时的主机白名单；留空表示不限制主机
  allowed-hosts: []
  # StreamProvider 选择顺序（前面的优先）
  provider-priority:
    - mineaudio-client

# MineAudio Client（配套 mod）协议
stream-client:
  enabled: true
  # 握手等待时间；超时按未安装处理
  handshake-timeout-ms: 3000
  # 客户端状态上报间隔（客户端也会按此配置发送）
  state-report-ms: 1000
  # 进服自动开启“正在播放”HUD（仅对有 MineUI HUD 能力位的客户端；无播放时自动隐藏）
  hud-auto: true
  sync:
    enabled: true
    # 全服同步的起播提前量
    initial-lead-ms: 1200
    ping-interval-ms: 10000
    drift-threshold-ms: 150
  firewall:
    https-only: true
    deny-private-network: true
    max-redirects: 5

# 音源解析器（Phase 8）：source+id → 直链；失败上报分类错误（由 UI/PAPI 展示）
resolvers:
  netease:
    enabled: true
    # 从环境变量读取 MUSIC_U（等同 bearer 凭证，不要写进配置文件/提交到仓库）
    credential-env: "MINEAUDIO_NETEASE_MUSIC_U"
    # 备选：从文件读取一行凭证（便于 systemd/容器部署）；env 优先
    credential-file: ""
    # 音质：standard / higher / exhigh / lossless / hires
    level: "exhigh"
    # 封面缩略图边长（网易 ?param=WxY）；0 = 使用原图
    cover-px: 64
    timeout-ms: 5000
    max-concurrent: 4

# 搜索（网易免签接口 + 批量 song/detail 补封面/标题/歌手）
search:
  enabled: true
  # 每页返回条数（1-10），页面/命令支持翻页；
  # 注意：MineUI 页面目前固定展示 6 条结果，超过部分只能走命令
  max-results: 6

# 点歌队列（每人一个，当前曲目自然结束后自动续播）
queue:
  # 每位玩家的队列上限；MineUI 页面固定 2 格队列展示，请保持 ≤2
  max-per-player: 2

# 输出更多日志，便于排查
debug: false
